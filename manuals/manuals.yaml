# The Prusa manuals this plan is built on. The PDFs themselves are not in the repo:
# download them from Prusa (see manuals/README.md) and drop them in this folder.
# "chapters" maps chapter number to its step count; tools/check.py uses it to prove
# that every step is accounted for, without needing the PDFs.
indx:
