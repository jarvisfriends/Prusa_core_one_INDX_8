  version: PDF generated 2026-10-01
  prefix: ""            # plan refs look like "3.17"
  image_prefix: i       # build/img/i3-17.jpg
  files: "*indx-conversion-kit*.pdf"   # one PDF, or several parts of it
  chapters: {1: 14, 2: 36, 3: 39, 4: 71, 5: 104, 6: 26}
