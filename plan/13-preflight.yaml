# Phase 13. Row ids are the keys for saved ticks: never rename or reuse one.
id: p13
name: "Preflight"
title: "Preflight: power on and calibrate"
power: "on"
where: "Printer"
note: >-
  First power since Phase 2.
  The wizard takes a while and wants the door shut except when it asks.
steps:

  - id: p13a
    refs: []
    kind: added
    text: >-
      Before plugging in:
      nothing loose on the bed or in the chamber, the toolhead slides to all four corners by hand, every tool is docked flush, and the box is out.

  - id: p13b
    refs: ["6.6"]
    kind: asis
    text: >-
      Insert the USB stick from Phase 0, connect power, switch on.
      When New firmware available appears, choose FLASH.
    notes:
      - type: tip
        by: "hyiger, Failopen, forum; Prusa release notes for 8.0.0"
        text: >-
          Use the newest release.
          Firmware 6.9.0 made tool offset calibration fail on a slightly dirty nozzle and 6.9.1 fixed it.
          8.0.0 (October 2026) approaches the dock more gently during dock calibration and lowers the bed further when a calibration needs a hand underneath.

  - id: p13c
    refs: ["6.7", "6.8"]
    kind: asis
    text: >-
      Choose the language, then printer model COREONEINDX, then Done.
      Network setup can be skipped and done later.
    notes:
      - type: warn
        by: "Stephen, comment on INDX 6.7; unverified"
        when: [gen2]
        text: >-
          With Gen 2 it is not known which entry is right.
          One builder who had flashed the INDX firmware saw COREONEGEN2 and, as far as his comment can be read, no COREONEINDX;
          he ended up running every calibration from the menu.
          Photograph the list before you choose, and check the belt setting in the next row whatever you pick.

  - id: p13d
    refs: []
    kind: added
    unless: [gen2]
    text: >-
      Before the wizard, go to Settings → Hardware → 1.5GT belts and turn it OFF.
      The INDX firmware defaults to on, and your original CORE One has 2GT belts:
      15 teeth in 30 mm.
    notes:
      - type: why
        by: "Prusa developer, GitHub issue 5444; firmware 6.9.0 release notes"
        text: >-
          The INDX firmware has one switch for the belt type, Settings → Hardware → 1.5GT belts, and it is on by default because new INDX machines ship with 1.5GT belts.
          With the old 2GT belts it must be off, or every dock reads about 3 mm out in Y.
      - type: tip
        by: "Art4 Tech, forum; GitHub issue 5444"
        text: >-
          With the firmware set for Gen 2 belts on a machine without them, every dock read about 3 mm short in Y and dock calibration could not pass.
          Correcting the setting and restarting fixed it.
      - type: warn
        by: "your build"
        when: [bucket]
        text: >-
          Larger bucket:
          also set Settings → Nozzle Cleaner → Nozzle Cleaner Capacity to Extended.

  - id: p13dg
    refs: ["G5.6", "G5.7"]
    kind: gen2
    when: [gen2]
    text: >-
      Check the belt setting before any calibration runs:
      Settings → Hardware → 1.5GT belts must be ON.
      It is the default in the INDX firmware, so normally there is nothing to change, but look.
      If the wizard starts first and will not let you out, let it run and come back to this setting as soon as the menu is available;
      rerun the axis, belt and dock calibrations if it was wrong.
      The Gen 2 guide's Settings → Hardware → Edition path belongs to the stock firmware, not to the INDX firmware.
      Your belts are 1.5GT:
      20 teeth in 30 mm.
    notes:
      - type: why
        by: "Gen 2 guide"
        text: >-
          Gen 2 uses belts and pulleys with a different tooth pitch, so the firmware has to be told.
      - type: why
        by: "Prusa developer, GitHub issue 5444; firmware 6.9.0 release notes"
        text: >-
          The INDX firmware has one switch for the belt type, Settings → Hardware → 1.5GT belts, on by default.
          Firmware 6.9.0 added belt switching for CORE One+ Gen 2 machines converted to INDX.
          What the first-run wizard shows on a Gen 2 build is still unconfirmed.
      - type: tip
        by: "Art4 Tech, forum; GitHub issue 5444"
        text: >-
          When this setting and the fitted belts disagreed, every dock read about 3 mm out in Y and dock calibration could not pass until the setting was corrected and the printer restarted.
      - type: warn
        by: "your build"
        when: [bucket]
        text: >-
          Larger bucket:
          also set Settings → Nozzle Cleaner → Nozzle Cleaner Capacity to Extended.
      - type: tip
        by: "Prusa staff, replies on Gen 2 5.4 and 5.7"
        text: >-
          Prusa staff confirm the edition has to be changed before the self-test runs.
          On stock firmware the Edition entry only exists from 6.8.1, so a Settings → Hardware menu without it means the firmware is too old.

  - id: p13e
    refs: ["6.9", "6.10"]
    kind: asis
    text: >-
      With the belt option set, start the self-test and keep the door closed until asked;
      parts get hot and move.
      Skip the door sensor calibration.
      The X and Y tests and Z alignment then run by themselves.
    notes:
      - type: warn
        by: "GitHub issue 5520 (open, Prusa developer replied); forum, Gantry Squaring Failing, Oct 2026"
        text: >-
          On some printers that started life as an original CORE One or an MK4, firmware from 6.9.1 final to 8.0.0 fails the X/Y test with early endstop trigger or Failed to measure axis:
          it homes with less motor current.
          One builder with Gen 2 and INDX passed only after flashing the 6.9.1 beta from GitHub.
          If this hits you, do not strip the gantry:
          try that firmware first.

  - id: p13f
    refs: ["6.11"]
    kind: asis
    tools: ["2.5 mm"]
    text: >-
      Belt tuning.
      Lid open, push the toolhead fully back and check both ends of the gantry touch their stops with no gap.
      Read Prusa's belt tension article first.
      The left screw sets the upper belt and the right screw the lower belt;
      follow the screen until both are in range.
    notes:
      - type: tip
        by: "Prusa article"
        text: >-
          If one gantry end stands off its stop, slacken both tensioners, square it, and tighten alternately in half turns.
      - type: tip
        by: "Logfella, hyiger, forum"
        text: >-
          Dock calibration is far more sensitive to belt tension and gantry squareness than the stock printer was.
          Loose belts showed up later as every tool being off by the same amount in Y.
      - type: tip
        by: "shmafoo, comment on INDX 6.11"
        when: [gen2]
        text: >-
          On one INDX plus Gen 2 build the wizard never asked for belt tuning:
          it went from the axis tests straight to dock calibration.
          If yours does the same, look for belt tuning under Control → Calibrations & Tests before trusting the dock results.
      - type: tip
        by: "A_Str8, comment on INDX 6.11"
        text: >-
          If the belt never appears to move however far you turn the screw, the tension is far outside the range:
          much too tight or much too loose.

  - id: p13g
    refs: ["6.12", "6.13", "6.14"]
    kind: asis
    tools: ["T10"]
    text: >-
      Dock calibration.
      Enter 8 docks and confirm every position is enabled.
      Snug the silver screws on all docks with the T10: seated, not stiff.
      Wait until the printer says it is safe to touch, then with the lid open slide the toolhead by hand onto dock 1 until it clicks, watching from above that it seats squarely on the hotend.
      Continue, and repeat for each dock.
      When all are done, loosen every silver screw one full turn.
    notes:
      - type: tip
        by: "chmax, forum"
        text: >-
          Hold the head fully over the tool and flush before the first button press.
      - type: tip
        by: "HChar, Brian Flores, SceneGreen, comments on INDX 6.14"
        text: >-
          If dock calibration fails with a difference above 1 mm, two builders passed only after backing the silver screws off one to two turns from snug, so each dock had a slight wiggle.
          A third passed with them snug, as written.
      - type: tip
        by: "DGP_Maluco, jche, iKriz, comments on INDX 6.14"
        text: >-
          A tool can sit slightly tilted in its dock.
          Look from above, push the head on straight, then snug that dock's screw.
          One builder never felt the click on any dock and calibration still passed.
      - type: tip
        by: "Danny, comment on INDX 6.14"
        text: >-
          Stray plastic on a printed dock can block calibration.
          One builder had to trim material sticking out of two docks before they passed.
      - type: tip
        by: "mk and Red, forum, docking calibration fails, Oct 2026"
        text: >-
          On Gen 2 belts, two builders whose docks would not calibrate got all eight to pass by picking up a tool and tightening both tensioners a quarter turn at a time, about one and a half turns in all.
      - type: tip
        by: "chmax, forum"
        text: >-
          If one dock keeps failing, swap tools 1 and 8 and run it again:
          if the failure moves with the tool, the tool is the problem, not the dock.

  - id: p13h
    refs: ["6.15", "6.16"]
    kind: asis
    text: >-
      Loadcell test:
      door open, wait for Tap nozzle NOW, then tap the nozzle from below;
      nothing is hot.
      Close the door.
      The Z test and a noisy fan test follow.
    notes:
      - type: tip
        by: "GitHub issues 5518 and 5548, Oct 2026"
        text: >-
          If the loadcell test reports a noisy signal, abort it and run it again.
          The extruder stepper can be left energised after a tool change, and that is enough to fail the test.

  - id: p13i
    refs: ["6.17"]
    kind: asis
    text: "Tool offsets calibration runs tool by tool."
    notes:
      - type: tip
        by: "gb160, Scotttomo, forum"
        text: >-
          If it fails on the first tool every time and the log says Failed to get first sensor sample, three builders traced it to a faulty offset sensor board, not their assembly.
          Squaring the gantry and checking the cable did not help;
          a replacement from support did.
      - type: tip
        by: "Prusa article #36130"
        text: >-
          For an out-of-bounds result, heat the nozzle and clean it with a brass brush, kept away from the hotend cables, then rerun the tool offsets calibration from Control → Calibrations and Tests.
      - type: tip
        by: "That Mohawk Kid, and Prusa staff, replies on INDX 6.17"
        text: >-
          Rolling the firmware back from 6.9.0 to 6.6.3 did not cure repeated failures for one builder.
          Prusa staff's answer to a calibration that keeps failing is the support chat.
      - type: tip
        by: "GitHub issue 5526; forum, tool offset calibration failing, Oct 2026"
        text: >-
          If it fails with error 36130 on a clean nozzle, turn off Settings → Lights → RGB Status Bar and rerun:
          the bed's status strip puts noise on the loadcell for some builders.
          Others added ferrite chokes on the LED cables or twisted the heater leads in the electronics box.
          Prusa has not replied.

  - id: p13j
    refs: ["6.18", "6.19", "6.20"]
    kind: asis
    tools: ["Universal wrench"]
    text: >-
      Nozzle cleaner.
      Through the opening under dock position 8, move the head by hand until the nozzle sits in the V of the silicone priming block.
      When the motors lock, take your hands out and turn the Wiper-adjuster with the universal wrench until the nozzle fills the V, touching both sides and the bottom.
      If the screen then asks for Y, put the nozzle in the V-shaped cutout marked Y on the left of the bin, touching no wall.
      Current firmware finds Y by itself and never asks.
    notes:
      - type: tip
        by: "Chris Hill, forum"
        text: >-
          The view is poor.
          He centres in X, gets close in Z, and uses the notch in the opposite corner of the tray as the Y reference.
          He also sets Z a touch past contact so the silicone deforms very slightly.
      - type: tip
        by: "forum; NickT_in_SD, Jim, Ben Dover, comments on INDX 6.19 and 6.20"
        text: >-
          Firmware 6.9.0 and later calibrate the wiper's X and Y automatically, leaving only Z by hand.
          Three builders confirm the Y step in the manual no longer appears:
          the printer probes the bin with the nozzle.
      - type: tip
        by: "Bartgalok, jche, comments on INDX 6.18"
        text: >-
          Point a phone camera through the opening and zoom in:
          the nozzle's contact with the V is far easier to judge on the screen.
          The V sits further back from the tool dock than the manual's picture suggests.
      - type: tip
        by: "HChar, comment on INDX 6.19"
        text: >-
          This height matters on every print.
          With even a small drop of filament left on the nozzle tip, the tool offset check at print start fails and the print does not begin.

  - id: p13k
    refs: ["6.21"]
    kind: asis
    text: >-
      Filament sensor calibration, one position at a time, with a short piece of filament pushed only through the sensor.
      No filament may be in the toolhead when it starts.
      Phase stepping and input shaper then run by themselves.
    notes:
      - type: tip
        by: "Tommy_Prusa3D, forum"
        text: >-
          There is no sensor in the toolhead.
          Loading means feeding about a metre of tube by hand, and auto-load works only for the tool currently picked up.
      - type: tip
        by: "n8petersen, MrTheHans, comments on INDX 6.21"
        text: >-
          No spool is needed.
          A few centimetres of filament is enough, so the marked gauge piece from Phase 8 does all eight positions.

  - id: p13l
    refs: ["6.22", "6.23"]
    kind: asis
    text: "Wizard complete. Finish the gummy bears."
    notes:
      - type: tip
        by: "Sergii, forum"
        text: >-
          A heater test that reports the nozzle temperature out of range passed for one builder when rerun with filament loaded;
          a moderator's advice was to update the firmware first.

  - id: p13m
    refs: ["6.24", "6.25", "6.26"]
    kind: asis
    text: >-
      Getting-started material is at prusa.io/coreone-indx.
      Prusa asks for a few minutes of feedback on the manual, and your first test prints are on Printables.

  - id: p13n
    refs: []
    kind: added
    when: [picam]
    text: >-
      Raspberry Pi camera:
      power the Pi, aim the camera at the bed and check a fresh snapshot arrives in Prusa Connect.
      Run a short print with a tool change and watch the first few changes:
      the ribbon must not move, and no tool or the head may touch the mount.
