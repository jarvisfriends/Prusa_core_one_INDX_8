# Phase 0. Row ids are the keys for saved ticks: never rename or reuse one.
id: p0
name: "Prepare"
title: "Prepare, with the printer still stock"
power: "on"
where: "Desk and computer"
note: >-
  The printer is the only machine that can make the helper parts, and support can post a missing screw while you can still print.
  Do all of this before a single rivet comes out.
steps:

  - id: p0a
    refs: ["1.1", "1.2", "1.3", "1.11", "1.12"]
    kind: asis
    text: >-
      Skim the introduction.
      Three points apply to you:
      the photos show a CORE One+, the same guide covers 4-tool and 8-tool kits, and nothing gets thrown away until the guide says so.
      The Gen 2 upgrade (step 11) is optional:
      tick it under Your build if you are fitting it and its steps appear where Prusa's companion article puts them.
      MMU3 removal (step 12) is not covered here.

  - id: p0b
    refs: ["1.4"]
    kind: asis
    text: >-
      Lay out the tools:
      needle-nose pliers, PH2 screwdriver, universal wrench, 2.0 and 2.5 mm Allen keys, T10 Torx, flush cutters.
      They are the ones that came with the printer;
      the kit ships without tools.
    notes:
      - type: tip
        by: "vhubbard, forum"
        text: >-
          The small L-keys get tiring over a build this long.
          A proper T10 driver and 2.5 mm hex driver are worth finding.
      - type: warn
        by: "manual"
        text: "A T10 screwdriver was only supplied with kit-built printers."
      - type: tip
        by: "langjai, jliss, comments on INDX 1.4 and 3.17"
        text: >-
          A bit driver with a flexible extension reaches screws the L-keys cannot turn squarely, such as the offset sensor screw driven from below in Phase 5.
          Fine tweezers help with connector latches and stuck collets in Phase 3.
      - type: tip
        by: "OversizedHat, 4nozzle, comments on INDX 1.4 and 2.25"
        text: >-
          Find the universal wrench that came with the printer before you start;
          two builders no longer had theirs.
          An ordinary 8 mm spanner undoes the Nextruder fitting in Phase 3.

  - id: p0c
    refs: ["1.5", "1.6"]
    kind: asis
    text: >-
      Print the 1:1 fastener cheatsheet from prusa.io/C1-INDX-cheatsheet at 100 % on A4, unscaled.
      Fasteners are bagged by type, not by chapter, and the count on each bag already includes its spares.
      Keep the welcome letter:
      its reverse side carries the PTFE length scale used in Phase 8.

  - id: p0d
    refs: ["1.7", "1.8"]
    kind: added
    text: >-
      Inventory the kit now.
      Count the `M3x12cT` countersunk screws:
      the build uses 32 (4 + 8 in the filament sensors, 16 in the tool holders, 4 in the lid hinges).
      Find the two `M3x35` for the dock fan:
      most kits have them in the Fasteners 2/2 INDX bag and have no Tool Dock Fan bag.
      Count the `M3nS` and `M3nN` nuts against the cheatsheet.
      Check the Electronics box holds the offset sensor, its cable and its sticker.
      Look over the printed parts for cracks;
      parts marked E, F or G are factory prints and identical files exist on Printables.
      Report anything missing to Prusa support before teardown.
    notes:
      - type: tip
        by: "gb160, vhubbard, forum digest"
        text: >-
          Builders reported being one `M3x12cT` short, no usable spares of that screw, and Tool Dock Fan bags with one `M3x35` instead of two.
      - type: tip
        by: "JanV, comment on INDX 2.2"
        text: >-
          Compare the eight Nozzle tools side by side now, without touching their rectangular sensing areas.
          One builder found a tool with its top pin missing and another 2.2 mm longer than the rest, but only after the whole build was finished.
      - type: tip
        by: "JDepto, Rich Adlam, comments on INDX 4.18 and 4.24"
        text: >-
          If the `Swingarm-clip` or `Head-cable-clip` seems to be missing from the Toolhead bag, look inside the `INDX-C1-Fan-shroud`.
          At least four builders found a clip wedged in there, one of them only after contacting support.
      - type: tip
        by: "several builders, comments on INDX 5.59"
        text: >-
          Many kits have no Tool Dock Fan bag.
          Ten builders found the two `M3x35` in the Fasteners 2/2 INDX bag, some with no spare.
          Count the `M3nS` nuts too:
          three builders used their very last one on the dock fan.

  - id: p0d2
    refs: []
    kind: gen2
    when: [gen2]
    text: >-
      Lay out the Gen 2 parts as well:
      eight new expansion joints, eight expansion joint screws, sixteen M3 PTFE washers, the 10 mm heatbed spacer, one `M3x14bT` screw, two T21-1.5GT pulleys, two 1.5GT belts, the Pulley-offset-tool and the Expansion-joint-aligner.
      Look at each of the eight expansion joint screws:
      every one needs a thread, and the kit has no spare.
      Add a fine flat file to your tools for the pulley swap.
    notes:
      - type: tip
        by: "HChar, shmafoo, Jeff K, comments on Gen 2 4.5 and 3.8"
        text: >-
          In an INDX kit that includes Gen 2, look in the large `INDX base` box for a small cardboard box marked UPGRADE.
          The pulleys, PTFE washers and 10 mm spacer are in the `Belts, Exp.
          joints (Gen 2)` bag.
      - type: warn
        by: "TMaa, Ren, Luis, comments on Gen 2 4.5"
        text: >-
          The kit holds exactly eight expansion joint screws and no spare.
          Two builders found one with no thread cut on it.
          Check all eight now and ask support for a replacement while the printer still works.

  - id: p0e
    refs: ["1.9", "1.10"]
    kind: asis
    text: >-
      Read the two technique notes.
      A nut that will not seat is pulled in with a fully threaded screw from the far side;
      a nut that falls out is held with tape, never glue.
      Electronics stay in their ESD bags until the row that fits them, and you touch bare metal before handling a board.

  - id: p0f
    refs: []
    kind: added
    text: >-
      Print the helpers you chose from the list above.
      At minimum the rivet remover and the hardware organizer.
    notes:
      - type: tip
        by: "your build"
        when: [light]
        text: >-
          Chamber light mount:
          print its four Prusa Edition holders now, in PETG with supports.

  - id: p0g
    refs: []
    kind: opt
    when: [bucket]
    text: >-
      Larger waste bucket:
      print its parts now.
      They are the large wiper bin, three legs, the drill guide and the bucket;
      Prusa suggests PCCF for the bin and PETG for the legs.
      The 32 mm hole in the right side panel is drilled in Phase 4, while the panel is on the bench.
    notes:
      - type: why
        by: "plan"
        text: >-
          On an 8-tool build the right panel ends up held by four puck holders, two of which need the printer tilted to remove.
          Drilling later means undoing them.
      - type: warn
        by: "unverified"
        text: >-
          I could not confirm how the bucket sits beside the right-hand spool holders on an 8-tool machine.
          Check the comments on Prusa's Printables page before you drill.

  - id: p0h
    refs: ["6.5"]
    kind: moved
    text: >-
      Download the latest CORE One/+ INDX firmware (`.bbf`) from help.prusa3d.com onto a USB stick at your computer.
      Use a different stick from any stock firmware update in Phase 2, and leave this one out of the printer until Phase 13.
    notes:
      - type: why
        by: "plan"
        text: >-
          One trip to the computer instead of two, and the file is waiting when the build is done.
      - type: tip
        by: "A_Str8, comment on INDX 6.5"
        text: >-
          The INDX firmware is a separate build from the stock CORE One firmware.
          Being up to date on stock firmware does not let you skip this download.

  - id: p0j
    refs: []
    kind: added
    when: [dryer]
    text: >-
      Dryer boxes:
      before teardown, decide where each box stands and how its four filaments reach the sensor block on that side.
      Filament enters each sensor port from below through a bare hole, so plan a smooth path up to it without tight bends, and get the PTFE tube and fittings the box outlets need.
    notes:
      - type: warn
        by: "unverified"
        text: >-
          Prusa's guide only covers spools hanging on the printer.
          The Creality SpacePi X4 has top and rear outlets with PTFE connectors and ships without tube.
          The kit's eight 880 mm tubes are all used between the sensors and the tools.
          The printed sensor top with couplers in the print list is one way to hold a tube at the sensor;
          I could not confirm which side its couplers sit on.

  - id: p0k
    refs: []
    kind: added
    when: [picam]
    text: >-
      Raspberry Pi camera:
      get it working on the desk before the printer comes apart.
      You need a Raspberry Pi (a Zero 2 W is enough), a Camera Module 3 (the Wide version sees more of the bed), a ribbon cable long enough to reach from the front corner of the chamber to wherever the Pi will sit outside it, a 5 V supply for the Pi, and a printed corner mount with its magnets.
      Print the mount now, in ASA or PETG.
      Flash Raspberry Pi OS Lite, then in Prusa Connect open the printer's Camera tab, choose Add new other camera and copy the token.
      Install an upload script on the Pi, give it the token and a fingerprint of your own, and check that a snapshot appears in Connect.
    notes:
      - type: tip
        by: "upload scripts"
        text: >-
          Two maintained scripts do the uploading:
          [prusa-connect-camera-script](https://github.com/nvtkaszpir/prusa-connect-camera-script) and
          [a shorter gist](https://gist.github.com/cannikin/4954d050b72ff61ef0719c42922464e5).
          Both take a still with `rpicam-still` and send it to Prusa Connect with the token and fingerprint.
          Pick the fingerprint once, 16 to 40 characters, and never change it.
      - type: tip
        by: "Printables"
        text: >-
          Magnetic corner mounts for the CORE One:
          [Pi Cam 3 corner mount](https://www.printables.com/model/1287989-core-one-corner-mount-for-pi-cam-3),
          [Magnetic Pi Camera v3 mount](https://www.printables.com/model/1313769-core-one-magnetic-pi-camera-v3-mount),
          [Raspberry Pi Camera Bracket](https://www.printables.com/model/1288678-core-one-raspberry-pi-camera-bracket) (Camera Module 2).
          Each lists its own magnets and screws.
      - type: warn
        by: "unverified"
        text: >-
          None of these mounts says it was tested with INDX fitted.
          Forum builders report the Buddy3D camera still sees the bed from the front left corner of an INDX printer, so a corner mount is the best guess.
          A mount that clips to the light bar is the riskiest: the light bar moves onto the tool dock.
      - type: warn
        by: "Raspberry Pi datasheets"
        text: >-
          Camera Module 3 is rated for 0 to 50 °C, which a heated chamber can exceed.
          The Pi itself stays outside the chamber on its own power supply:
          the printer's camera port is specified for the Buddy3D, at 5 V and 1 A.
      - type: tip
        by: "Prusa Connect"
        text: >-
          Connect takes at most one picture every ten seconds from a camera added this way, and shows none while the printer is offline.
          There is no live video.

  - id: p0i
    refs: ["1.13", "1.14"]
    kind: asis
    text: >-
      Clear about 1.5 × 1.5 m of bench, add light, and put a sheet of cardboard under the printer so it can be turned and tilted without scratching anything.
      Hide the Haribo.
