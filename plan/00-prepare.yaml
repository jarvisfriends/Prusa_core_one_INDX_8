# Phase 0. Row ids are the keys for saved ticks: never rename or reuse one.
id: p0
name: "Prepare"
title: "Prepare, with the printer still stock"
power: "on"
where: "Desk and computer"
note: >-
  The printer is the only machine that can make the helper parts, and support can post a missing screw while you can still print.
  Do all of this before a single rivet comes out.
steps:

  - id: p0a
    refs: ["1.1", "1.2", "1.3", "1.11", "1.12"]
    kind: asis
    text: >-
      Skim the introduction.
      Three points apply to you:
      the photos show a CORE One+, the same guide covers 4-tool and 8-tool kits, and nothing gets thrown away until the guide says so.
      The Gen 2 upgrade (step 11) is part of this build and is slotted in where Prusa's companion article puts it.
      MMU3 removal (step 12) does not apply.

  - id: p0b
    refs: ["1.4"]
    kind: asis
    text: >-
      Lay out the tools:
      needle-nose pliers, PH2 screwdriver, universal wrench, 2.0 and 2.5 mm Allen keys, T10 Torx, flush cutters.
      They are the ones that came with the printer;
      the kit ships without tools.
    notes:
      - type: tip
        by: "vhubbard, forum"
        text: >-
          The small L-keys get tiring over a build this long.
          A proper T10 driver and 2.5 mm hex driver are worth finding.
      - type: warn
        by: "manual"
        text: "A T10 screwdriver was only supplied with kit-built printers."

  - id: p0c
    refs: ["1.5", "1.6"]
    kind: asis
    text: >-
      Print the 1:1 fastener cheatsheet from prusa.io/C1-INDX-cheatsheet at 100 % on A4, unscaled.
      Fasteners are bagged by type, not by chapter, and the count on each bag already includes its spares.
      Keep the welcome letter:
      its reverse side carries the PTFE length scale used in Phase 8.

  - id: p0d
    refs: ["1.7", "1.8"]
    kind: added
    text: >-
      Inventory the kit now.
      Count the `M3x12cT` countersunk screws:
      the build uses 32 (4 + 8 in the filament sensors, 16 in the tool holders, 4 in the lid hinges).
      Confirm the Tool Dock Fan bag holds two `M3x35`.
      Look over the printed parts for cracks;
      parts marked E, F or G are factory prints and identical files exist on Printables.
      Report anything missing to Prusa support before teardown.
      Lay out the Gen 2 parts as well:
      eight new expansion joints, eight expansion joint screws, sixteen M3 PTFE washers, the 10 mm heatbed spacer, one `M3x14bT` screw, two T21-1.5GT pulleys, two 1.5GT belts, the Pulley-offset-tool and the Expansion-joint-aligner.
    notes:
      - type: tip
        by: "gb160, vhubbard, forum digest"
        text: >-
          Builders reported being one `M3x12cT` short, no usable spares of that screw, and Tool Dock Fan bags with one `M3x35` instead of two.

  - id: p0e
    refs: ["1.9", "1.10"]
    kind: asis
    text: >-
      Read the two technique notes.
      A nut that will not seat is pulled in with a fully threaded screw from the far side;
      a nut that falls out is held with tape, never glue.
      Electronics stay in their ESD bags until the row that fits them, and you touch bare metal before handling a board.

  - id: p0f
    refs: []
    kind: added
    text: >-
      Print the helpers you chose from the list above.
      At minimum the rivet remover and the hardware organizer.
      If you want the chamber light mount, print its four Prusa Edition holders now.

  - id: p0g
    refs: []
    kind: opt
    text: >-
      Decide on Prusa's larger waste bucket.
      It is a set of parts you print (large wiper bin, three legs, drill guide, bucket;
      Prusa suggests PCCF for the bin and PETG for the legs) and it needs a 32 mm hole step-drilled through the right side panel unless yours is already perforated.
      If you want it, print the parts now and drill in Phase 4 while the panel is on the bench.
      If you are unsure, build stock.
    notes:
      - type: why
        by: "plan"
        text: >-
          On an 8-tool build the right panel ends up held by four puck holders, two of which need the printer tilted to remove.
          Drilling later means undoing them.
      - type: warn
        by: "unverified"
        text: >-
          I could not confirm how the bucket sits beside the right-hand spool holders on an 8-tool machine.
          Check the comments on Prusa's Printables page before you drill.

  - id: p0h
    refs: ["6.5"]
    kind: moved
    text: >-
      Download the latest CORE One/+ INDX firmware (`.bbf`) from help.prusa3d.com onto a USB stick at your computer.
      Use a different stick from any stock firmware update in Phase 2, and leave this one out of the printer until Phase 13.
    notes:
      - type: why
        by: "plan"
        text: >-
          One trip to the computer instead of two, and the file is waiting when the build is done.

  - id: p0i
    refs: ["1.13", "1.14"]
    kind: asis
    text: >-
      Clear about 1.5 × 1.5 m of bench, add light, and put a sheet of cardboard under the printer so it can be turned and tilted without scratching anything.
      Hide the Haribo.
