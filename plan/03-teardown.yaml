# Phase 3. Row ids are the keys for saved ticks: never rename or reuse one.
id: p3
name: "Teardown"
title: "Teardown"
power: "off"
where: "Printer"
note: >-
  Worked station by station:
  top and front, inside, back, left, the Nextruder, then the right side.
  The manual's order inside each station is unchanged.
  With Gen 2 ticked, three of the four side pieces come off straight after the door, so both hands reach everything that follows.
steps:

  - id: p3a
    refs: ["2.1", "2.7"]
    kind: asis
    text: >-
      Chapter 2 tools:
      both Allen keys, T10, pliers or cutters, PH2, universal wrench.
      Sort every removed screw into the organizer as it comes out;
      the table above lists the ones you need again.

  - id: p3b
    refs: ["2.8", "2.9"]
    kind: asis
    tools: ["Rivet tool"]
    text: >-
      Pull the four nylon rivets from the top panel and lift the panel off.
      It is not used again.
    notes:
      - type: tip
        by: "forum digest"
        text: >-
          Pushing a rivet's centre pin from the inside first gives better control.
      - type: tip
        by: "Taeke, langjai and Prusa staff, comments on INDX 2.8 and 1.4"
        text: >-
          Small flush cutters slid under the rivet head and used gently as a lever lift rivets cleanly.
          One builder found the printed remover wore out after a few rivets.
          Prusa staff:
          any method that leaves the panel unmarked is fine.
      - type: tip
        by: "Balu, Imelda Blackburn, Trainman, comments on Gen 2 2.3"
        text: >-
          Two builders rated the rivet extraction tool, Printables model 1349886, the best they tried.
          Where the back of a rivet is hard to reach, a fingernail under its head pulls it from the front.
          Flush cutters work but can scratch the panel.

  - id: p3c
    refs: ["2.10"]
    kind: asis
    tools: ["2.5 mm", "T10"]
    text: >-
      Remove the two `M3x4` screws from the top front panel and the two `M3x4rT` from the front, then lift out the top profile.
      Keep all four.
    notes:
      - type: tip
        by: "Danshari, comment on INDX 2.10"
        text: >-
          On one builder's printer the two top screws were Torx as well.
          If the 2.5 mm key does not seat, try the T10.

  - id: p3d
    refs: ["2.11"]
    kind: asis
    tools: ["T10"]
    text: >-
      Take the door off.
      Hold the panel, remove the two `M3x5rT` from each hinge starting with the lowest, and slide the door out.
      If a hinge shaft drops out, push it back or bag it with the hinge.
      Keep these four screws apart from the `M3x4rT`.
    notes:
      - type: tip
        by: "several builders, comments on INDX 2.11"
        text: >-
          Thread the four `M3x5rT` straight back into the empty hinges once the door is out.
          They look almost identical to the `M3x4rT` that come out next, and one builder who set them aside lost them.

  - id: p3e
    refs: ["2.32"]
    kind: moved
    tools: ["T10"]
    text: >-
      Old spool holder.
      Lift the box off the bed, remove the four `M3x8rT` inside the right wall while holding the spool holder, take it off, and put the box back.
      Mind the heatbed surface while the box is off.
    notes:
      - type: why
        by: "plan"
        text: >-
          The T10 is already in your hand and the door is out of the way.
          In the manual this is the last teardown step;
          nothing depends on that.

  - id: p3s
    refs: ["G2.6", "G2.4", "G2.5"]
    kind: gen2
    when: [gen2]
    tools: ["Rivet tool"]
    text: >-
      Three of the four side pieces come off now.
      Five rivets and the transparent side cover on the right.
      Five rivets and the transparent side cover on the left.
      Then the eleven rivets of the left steel panel, bottom ones first, with a hand on the panel as the last come out.
      Store them flat and clean.
      The right steel panel has to wait until its handle and filament sensor are off, at the end of this phase.
    notes:
      - type: why
        by: "plan"
        text: >-
          Prusa's article removes the left pair after step 3.10 and the right pair after step 4.3.
          Off now, they leave both sides open for the electronics box, the cable straps on the left and the whole Nextruder teardown.
      - type: tip
        by: "4nozzle, Steve Stratoti, Jason K, Paul, langjai, comments on INDX 2.11, 2.19, 2.32, 2.36 and 3.10; Tkadla, comment on Prusa's article"
        text: >-
          Five builders took side pieces off earlier than the manuals do, three of them before the Nextruder teardown, and say the steps after it were much easier.
          A sixth asks Prusa to start the combined guide that way.
      - type: tip
        by: "vhubbard, chmax, forum"
        text: >-
          A builder who did Gen 2 and INDX together advised taking all the side panels off to begin with.

  - id: p3f
    refs: ["2.12"]
    kind: asis
    tools: ["T10"]
    text: >-
      Inside the printer:
      remove the two `M3x4rT` that hold the back cover.
      Go round the back, slide the centre cover down until its four hooks clear the chassis, and remove it.
      A screwdriver through the opening works as a lever if it sticks.

  - id: p3g
    refs: ["2.13"]
    kind: asis
    tools: ["T10"]
    text: "Remove the six `M3x4rT` from the xBuddy box cover and slide it out."

  - id: p3h
    refs: ["2.14"]
    kind: asis
    tools: ["PH2", "Cutters"]
    text: >-
      Undo the two 6-32 terminal screws and free the heatbed power cables, then thread both screws back in at least three turns.
      Press the latch and unplug the heatbed thermistor.
      Cut the zip ties down the right side of the box and keep the cutters clear of the cables.
      The manual leaves the lowest tie in place;
      cut it too if the thermistor cable runs under it.
      If you cut it, a new tie goes in its place in Phase 5.
    notes:
      - type: tip
        by: "FoxRun3D, forum"
        text: >-
          One builder dropped a terminal screw into the electronics box and never found it.
          Thread them back in before you do anything else.
      - type: tip
        by: "Skirfir, comment on INDX 2.14"
        text: >-
          To keep the cutters away from the wires, snip through the head of each zip tie, not its strap.
      - type: tip
        by: "several builders, comments on INDX 2.14"
        text: >-
          On five builders' printers the thermistor cable was also held by the lowest tie, the one marked not to cut.
          It would not come free until that tie was cut as well.

  - id: p3i
    refs: ["2.15"]
    kind: asis
    text: >-
      Press each latch and unplug the Nextruder main cable from the xBuddy board, then the side filament sensor and the RGB LED cable from the extension board.

  - id: p3j
    refs: ["2.16", "2.17", "2.18"]
    kind: asis
    tools: ["Cutters"]
    text: >-
      Feed the loose cables out through the openings at the top of the box without forcing them, and cut the zip ties on the harness without nicking a cable.
      Ease the upper grommet outward and push the Nextruder main cable fully into the printer through the upper oval opening.
      Push the side filament sensor cable in through whichever oval opening it uses:
      the manual shows the lower one, but on most printers it shares the upper one with the Nextruder cable.
      Then reseat the grommet.
      Cut the tie on the heatbed bundle and guide that inside too.
    notes:
      - type: tip
        by: "several builders, comments on INDX 2.17"
        text: >-
          On at least six printers the side filament sensor cable ran through the upper oval opening with the Nextruder cable, and the lower oval was empty with no grommet.
      - type: tip
        by: "several builders, comments on INDX 2.18"
        text: >-
          The heatbed bundle goes in more easily with its round rubber grommet pulled out of the panel first.
          Left in, the grommet tends to get pushed into the printer.
          Keep it for Phase 5.

  - id: p3i2
    refs: ["G2.12"]
    kind: gen2
    when: [gen2]
    text: >-
      While the box is open, press the latches and unplug the X motor cable (first connector on the left) and the Y motor cable (second from the left) from the xBuddy board.
      Ease a little slack toward the motors but keep both connectors inside the electronics box.
      If a cable resists, stop;
      if it will not move at all, cut the zip tie holding that bundle, without nicking a cable.
    notes:
      - type: why
        by: "plan"
        text: >-
          Prusa's companion article sends you back to the electronics box for this after step 3.10.
          The box is open now.
      - type: tip
        by: "Sembazuru, Paul, comments on Gen 2 2.12 and 2.14"
        text: >-
          If a fingertip cannot press a connector latch, press it with the end of a hex key.
          The plug then comes out with almost no force.

  - id: p3k
    refs: ["2.19"]
    kind: asis
    tools: ["2.5 mm"]
    text: >-
      Left side of the printer:
      release the five cable straps, then loosen the M3 screw of the cable clip behind the Y motor and let the cable hang with the clip.
      Keep two of the straps for step 4.31.
    notes:
      - type: tip
        by: "Danshari, comment on INDX 2.19"
        text: >-
          One builder's cable clip screw was Torx.
          If the 2.5 mm key does not fit, try the T10.

  - id: p3l
    refs: ["2.20", "2.21", "2.22", "2.23"]
    kind: asis
    tools: ["2.5 mm"]
    text: >-
      Nextruder covers and cables.
      Remove the `M3x10` and the left side cover, unlock the Idler-swivel and open the idler fully.
      Unplug every cable on the left of the LoveBoard except the main cable, then the extruder motor cable on top.
      Remove the two `M3x6` and the right cover, and unplug both cables on the right.
      Press every latch first.
    notes:
      - type: tip
        by: "Probe3254, btarlton, comments on INDX 2.20 and 2.21"
        text: >-
          Two builders unplugged the left-hand cables before opening the idler:
          the open idler arm keeps dropping in front of the connectors.
      - type: tip
        by: "several builders, comments on INDX 2.21"
        text: >-
          Five plugs come off on the left:
          four white and one black, sideways at the top and easy to miss.
          The black one lets go when its wire side is squeezed.
          Tweezers or a small flat screwdriver hold a latch down while you ease a plug out.
      - type: tip
        by: "Ben Dover, comment on INDX 2.23"
        text: >-
          On an original CORE One the right cover is the older trapezoid-shaped part, not the one in the photo.

  - id: p3m
    refs: ["2.24", "2.25"]
    kind: asis
    tools: ["Universal wrench", "2.5 mm"]
    text: >-
      Slide the bowden-bend over the fitting, press the black collet down with two fingers and pull the PTFE tube out.
      Unscrew the M5-4 fitting with the 8 mm cutout of the wrench.
      Remove the two `M3x18` from the heatsink fan and let it hang on its cable.
    notes:
      - type: tip
        by: "several builders, comments on INDX 2.24"
        text: >-
          If the tube will not let go, press the collet down with needle-nose pliers instead of fingers, push the tube in slightly, then pull.
          Two builders unscrewed the `M5-4` fitting first and pulled the tube off it afterwards.
      - type: tip
        by: "Zarderxio, Pete, comments on Gen 2 2.13"
        text: >-
          The `M5-4` fitting has a small washer that drops off as it unscrews.
          Catch it and bag it with the fitting if you are keeping the Nextruder as a spare.

  - id: p3n
    refs: ["2.26"]
    kind: asis
    tools: ["2.5 mm"]
    text: >-
      Hold the Nextruder and remove the three `M3x10` that fix it to the X-axis.
      Lift it out, unhook the heatsink fan cable and remove the fan.
    notes:
      - type: tip
        by: "Ben Dover, btarlton, 4nozzle, comments on INDX 2.26"
        text: >-
          Three small spacers sit behind the Nextruder at these screws.
          They may stay on the holder or come away with the Nextruder;
          catch any that drop.

  - id: p3o
    refs: ["2.27", "2.28", "2.29"]
    kind: asis
    tools: ["2.5 mm", "T10"]
    text: >-
      Back of the print head:
      remove the `M3x25` and lift the print fan out;
      it is reused.
      Remove the two `M3x10` and the rear cover and free the main cable from its groove.
      Remove the `M3x8rT` and take out the LoveBoard with its cable, then the two `M3x10` and the Loveboard-holder.
      Remove the two `M3x10` and the Fan-shroud, then the two `M3x4rT` and the Cable-clip.
      The Nextruder holder stays on the belts for now.
    notes:
      - type: why
        by: "plan"
        text: >-
          The holder is what keeps the belts on the motor pulleys.
          It comes off in Phase 6, once the work under the gantry is finished.
      - type: tip
        by: "iKriz, MartinD, comments on INDX 2.29"
        text: >-
          The two `M3x4rT` of the Cable-clip drop into the printer easily;
          keep a hand under them.
          One builder's printer had no Cable-clip at all.

  - id: p3p
    refs: ["2.30", "2.31"]
    kind: asis
    tools: ["T10", "Cutters"]
    text: >-
      Right side:
      press the collet in the handle and pull the PTFE tube out.
      Remove the two `M3x8rT` that hold the handle and the filament sensor and take the handle off.
      Inside, cut the zip tie near the PTFE tube to free the sensor cable from under the CoreXY frame, and take the sensor out.
    notes:
      - type: tip
        by: "several builders, comments on INDX 2.30 and 2.31"
        text: >-
          If the tube stays stuck, hold the collet in with tweezers and pull the tube with pliers, or undo the handle screws first and draw the tube out from behind.
          Handle, tube, sensor and its cable can also leave as one piece.
      - type: tip
        by: "John, comment on INDX 2.30; manual's parts recap"
        text: >-
          One builder snapped the tube and broke a collet getting it out.
          No harm done:
          the old handle, tube and side sensor are not on the manual's keep list.
      - type: tip
        by: "Paul, ygram, comments on Gen 2 2.7"
        text: >-
          If the PTFE tube will not pull out of the handle, undo the two `M3x8rT` first, then push the tube further into the fitting until it comes out the other side.

  - id: p3q
    refs: ["5.2"]
    kind: moved
    tools: ["2.5 mm", "Rivet tool"]
    text: >-
      Remove the `M3x10` and the Bowden-guide from the right rear corner;
      the guide is not used again.
      Pull the eleven nylon rivets from the right steel panel, bottom ones first, with a hand on the panel as the last come out, and lift it onto the bench.
    notes:
      - type: why
        by: "plan"
        text: >-
          The INDX guide removes this panel in chapter 5.
          With it off now, the right bed spacer, offset sensor cable, gantry and dock fan cable are all reached from an open side, and it goes back at the guide's own step 5.24.
          It cannot come off earlier:
          the handle and the side filament sensor are screwed together through it.
      - type: tip
        by: "chmax, vhubbard, forum"
        text: >-
          Two builders recommended exactly this.
          Prusa's Gen 2 article also runs the gantry and toolhead steps with the side panels off.

  - id: p3q2
    refs: []
    kind: added
    unless: [gen2]
    tools: ["Rivet tool"]
    text: >-
      While the rivet tool is out, also pull the upper-centre rivet from each transparent side cover.
      The filament sensor blocks screw into those holes in Phase 8 (steps 4.54 and 4.63).
    notes:
      - type: tip
        by: "Steve Stratoti, 4nozzle, chew2c and others, comments on INDX 2.11, 2.19 and 5.14"
        text: >-
          Some builders took both transparent covers right off, five rivets each, for hand access to the gantry, the dock fan cable and the sensors.
          Without Gen 2 that is optional.
          If you do it, hang them back with four rivets each before the sensor blocks go on in Phase 8.
          With the covers left on, the dock fan cable ties in Phase 7 are reached through the open steel-panel side, as in the manual's photos.

  - id: p3r
    refs: ["2.33", "2.34", "2.35", "2.36"]
    kind: asis
    text: >-
      Check you still have the back cover, xBuddy cover, print fan, print sheet, two cable straps, the door, and every side panel and side cover you took off.
      Six gummy bears.
