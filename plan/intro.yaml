legend_title: How to read a row
pictures_note: >-
  Each row shows the pictures and original text of the manual steps it covers.
  The coloured squares match the coloured arrows in the pictures.
  Tap a picture to enlarge it, or follow the link beside a step's title to that step on Prusa's site.
  Ticking a row stamps it done and folds its pictures away.
  The code at the right of a row, such as #p6f, is a link to that row: use it when you report a problem.

legend:
  - kind: asis
    text: manual order kept
  - kind: moved
    text: same step, different moment
  - kind: gen2
