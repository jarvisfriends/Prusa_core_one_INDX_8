# Bins: how to sort the kit's fasteners and the hardware that comes off the printer into
# Gridfinity bins, one set per phase, so only the current phase's bins are open on the bench.
#
# Each bin: what goes in, how many, where it comes from, and which rows use it. Counts are
# what the rows need; spares stay in the kit bags (or the "spares" bin). Bins carry the same
# when:/unless: option conditions as rows. `size` is in Gridfinity units (1x1 = 42 x 42 mm).
# `kind`: new (from the kit), kept (removed from the printer in Phase 3), print (printed parts).
#
# tools/kitting.py turns this into docs/KITTING.md, docs/labels.html and docs/labels.csv.
# `line2` overrides the second label line (default: the rows and steps).
# `tray: false` keeps a bin out of a divided tray (magnets, balls, anything bulky).
# `short` is the one-line label used when the bin becomes a compartment of a tray.
# Label lines are made for 12 mm label tape: line 1 is "P5  M3x18 x4", line 2 the rows and steps.
title: Bins, one set per phase
note: >-
  Sort everything in Phase 0, while the printer still prints. That is also the inventory the
  plan asks for: a bag that comes up short shows up here, not mid-build. Removed hardware is
  sorted in Phase 3 into the "keep" bins, then split into the phase bins at the end of the
  teardown. Printed parts stay in their labelled kit bags unless a bin is listed for them.
spares:
  - id: kspare
    phase: p0
    part: Spares
    label: Kit spares
    text: Every new fastener left over after the bins below are filled. The counts on the bags include spares.
    size: 1x2
  - id: kscrap
    phase: p3
    part: Scrap
    label: Not needed again
    text: >-
      Everything removed that no row needs again, so it cannot be mistaken for a kept part:
      the old bed spacer, extra Nextruder screws, the Bowden-guide, the old belts and pulleys with Gen 2.
    size: 2x2
