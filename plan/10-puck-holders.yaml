# Phase 10. Row ids are the keys for saved ticks: never rename or reuse one.
id: p10
name: "Puck holders"
title: "Puck holders, with one tilt"
power: "off"
where: "Printer"
note: >-
  Each bottom holder takes three screws, two reachable upright and one only from underneath.
  Each top holder takes two.
  The black Spoolholder-assembly-tool holds the nuts on the inside.
  The manual names the nut pocket by the arrow printed beside it:
  always the pocket nearer the top edge of the tool, except rear top left, which uses the pocket nearer the bottom edge.
  Builders dispute the manual's photos of the tool at the top corners, so do not trust a photo over your eyes:
  hold the tool in place, look through the holder's screw holes, and turn the tool over if the nuts are not centred behind them.
  With dryer boxes ticked, this whole phase is one skip row.
steps:

  - id: p10x
    refs: ["5.25", "5.26", "5.27", "5.28", "5.29", "5.30", "5.31", "5.32", "5.33", "5.34", "5.35", "5.36", "5.37", "5.38", "5.39", "5.40", "5.41", "5.42", "5.43", "5.44", "5.45", "5.46", "5.47", "5.48", "5.49", "5.50", "5.51", "5.52", "5.53", "5.54", "5.55", "5.56", "5.57", "5.58"]
    kind: skip
    when: [dryer]
    text: >-
      Skip the puck holders entirely:
      no puck holder assembly, no corner screws or rivets to remove, and no tilting the printer.
      Leave the corner `M3x4rT` screws in both side panels.
    notes:
      - type: why
        by: "your build"
        text: >-
          Puck holders only carry the telescopic spool holders.
          With dryer boxes beside the printer there is nothing to hang on them.
      - type: tip
        by: "gb160, Scotttomo, forum"
        text: >-
          A builder asked whether the spool holder steps could be skipped;
          another who had finished the conversion thought it should be fine.
      - type: tip
        by: "PetrichorPete, chew2c, comments on INDX 5.25 and 5.19"
        text: >-
          One commenter on Prusa's manual tells builders who do not want spool holders to jump from here to the dock fan, and another said he was leaving them off.
          Neither reported back on the finished printer.

  - id: p10a
    refs: ["5.27", "5.28"]
    kind: asis
    unless: [dryer]
    tools: ["Rivet tool", "T10"]
    text: >-
      Left side.
      Pull the rivets from the two marked holes at each lower corner;
      if this panel went back on with three rivets after Gen 2, those holes are already empty.
      Remove the upper `M3x4rT` from the front and back corners of the panel.
      Hang a Puck holder bottom in the rear corner and one in the front corner, each the right way round, each with one `M3x12rT`.
    notes:
      - type: warn
        by: "WarezMonkey, chew2c, sworcester, comments on INDX 5.19 and 5.28"
        text: >-
          From here on a side panel only comes off by undoing puck-holder nuts.
          One builder found an X/Y fault at the first self-test and had to do exactly that;
          two others left the panels and holders off until the printer had passed its tests.
          This plan keeps the manual's order and first powers up in Phase 13.
          Nobody has reported how far the INDX wizard runs without the dock and tools.
      - type: warn
        by: "mtbrider, comment on INDX 5.27"
        unless: [gen2]
        text: >-
          Two rivets come out of each lower corner, four in all, and the lower one of each pair is easy to miss in the photo.
          A builder who pulled only two had to take both bottom holders off again.
      - type: tip
        by: "katespace, comment on INDX 5.28"
        text: >-
          While tightening the first screw, push a spare Allen key through another hole of the holder into the panel.
          It keeps the remaining holes lined up for the nut screws that follow.
          The same works on the right side.

  - id: p10b
    refs: ["5.29", "5.30"]
    kind: asis
    unless: [dryer]
    tools: ["T10"]
    text: >-
      Front bottom left.
      One `M3nN` in the assembly tool, pushed fully home, rubber-free face outward, in the pocket by the arrow pointing UP.
      Hook the tool's ridge on the metal profile inside the front left corner with the nut toward the panel, hold it, and drive an `M3x12rT` into it.
    notes:
      - type: tip
        by: "several builders, comments on INDX 5.30, 5.31 and 5.44"
        text: >-
          If your hand will not reach the lower corners, wind the bed up 3 to 5 cm by turning a Z lead screw by hand.
          Five builders did this and then reached in beneath the bed.
          The rear corners are the tightest.
      - type: tip
        by: "atxkev and others, comments on INDX 5.31 and 5.36"
        text: >-
          To find a nut you cannot see, poke a thin Allen key through the holder's screw hole into the nut in the tool, hold the tool there, then swap the key for the `M3x12rT`.
          Sighting the nut through the hole also works.

  - id: p10c
    refs: ["5.31", "5.32"]
    kind: asis
    unless: [dryer]
    tools: ["T10"]
    text: >-
      Rear bottom left.
      One nut in the pocket by the arrow pointing RIGHT.
      Hook, hold, and drive an `M3x12rT`.

  - id: p10d
    refs: ["5.35", "5.36", "5.37"]
    kind: asis
    unless: [dryer]
    tools: ["Rivet tool", "T10"]
    text: >-
      Pull the rivets from the two marked holes at each top corner on the left, if any are there.
      Front top left:
      two nuts in the tool, hook it on the profile and push gently upward.
      Before driving anything, sight both nuts through the holder's holes;
      if they are not centred, turn the tool over.
      Start an `M3x12rT` in the puck holder top before offering it up, then tighten the top screw and the lower screw.
    notes:
      - type: warn
        by: "several builders, comments on INDX 5.36"
        text: >-
          Do not trust this step's photos of the tool:
          five builders say they are wrong or swapped with the rear corner's, one found them correct.
          Before driving a screw, look through the holder's holes for both nuts.
          If they are not centred, turn the tool over.

  - id: p10e
    refs: ["5.38", "5.39"]
    kind: asis
    unless: [dryer]
    tools: ["T10"]
    text: >-
      Rear top left.
      Two nuts, using the pocket nearer the bottom edge, by the arrow pointing DOWN.
      Hook, push up, sight the nuts through the holes and turn the tool over if they are off, then top screw and lower screw.
    notes:
      - type: tip
        by: "several builders, comments on INDX 5.38"
        text: >-
          Four builders got this corner first try with the tool turned upside down, short end on top, sighting the nuts through the holes before inserting a screw.
          Three others dropped the tool and held each nut with long-nose pliers.

  - id: p10f
    refs: ["5.40", "5.41"]
    kind: asis
    unless: [dryer]
    tools: ["T10"]
    text: >-
      Right side.
      Remove the upper `M3x4rT` from the front and back corners.
      Hang a Puck holder bottom in the front corner and one in the back corner, one `M3x12rT` each.

  - id: p10g
    refs: ["5.42", "5.43"]
    kind: asis
    unless: [dryer]
    tools: ["T10"]
    text: >-
      Front bottom right.
      One nut, arrow pointing RIGHT.
      Hook inside the front corner, hold, drive an `M3x12rT`.

  - id: p10h
    refs: ["5.44", "5.45"]
    kind: asis
    unless: [dryer]
    tools: ["T10"]
    text: >-
      Rear bottom right.
      One nut, arrow pointing UP.
      Hook at the back, hold, drive an `M3x12rT`.

  - id: p10i
    refs: ["5.55", "5.56"]
    kind: moved
    unless: [dryer]
    tools: ["T10"]
    text: >-
      Front top right.
      Two nuts as in the photo, arrow pointing RIGHT.
      Hook, push up, pre-start the screw in the holder, top screw then lower screw.
    notes:
      - type: why
        by: "plan"
        text: >-
          The manual fits the two right-hand tops after the tilt.
          They are reached upright exactly like the left-hand tops, so they are done here and the tilt finishes the job.
          If a photo does not match what you see, do these two after the tilt as printed.
      - type: why
        by: "bioxz, comment on INDX 5.46"
        text: >-
          A builder on Prusa's manual recommends this same order.
          The assembly tool is needed for the top holders and can break during the work under the printer, where a wrench can hold the nuts instead.

  - id: p10j
    refs: ["5.57", "5.58"]
    kind: moved
    unless: [dryer]
    tools: ["T10"]
    text: >-
      Rear top right.
      Two nuts as in the photo, arrow pointing UP.
      Hook, push up, top screw then lower screw.

  - id: p10k
    refs: ["5.46"]
    kind: asis
    unless: [dryer]
    text: >-
      Tilt.
      Take the box off the heatbed and stand it behind the printer.
      Toolhead to the back, all PTFE tubes inside, sensor cables clear.
      Lay the printer slowly back onto the box and make sure it cannot slide.
      A second person to steady it is worth asking for.

  - id: p10l
    refs: ["5.47", "5.48"]
    kind: asis
    unless: [dryer]
    tools: ["T10"]
    text: >-
      Rear bottom left, from underneath.
      One nut, arrow pointing RIGHT.
      Set the tool's highlighted ridge against the bottom profile, nut toward the panel, hold from inside and drive the third `M3x12rT`.
    notes:
      - type: tip
        by: "several builders, comments on INDX 5.47 and 5.54"
        text: >-
          Under the tilted printer the corners are open.
          Eight builders put the tool down and held the nut with long-nose pliers or a 5.5 mm nut driver or spanner.
          One found the tool fine once its ridge sat on the profile.

  - id: p10m
    refs: ["5.49", "5.50"]
    kind: asis
    unless: [dryer]
    tools: ["T10"]
    text: >-
      Front bottom left.
      One nut, arrow UP.
      Hook under the front, push up gently, drive the screw.

  - id: p10n
    refs: ["5.51", "5.52"]
    kind: asis
    unless: [dryer]
    tools: ["T10"]
    text: "Rear bottom right. One nut, arrow UP. Hook, push up, drive the screw."

  - id: p10o
    refs: ["5.53", "5.54"]
    kind: asis
    unless: [dryer]
    tools: ["T10"]
    text: >-
      Front bottom right.
      One nut, arrow RIGHT.
      Hook, push up, drive the screw.
      Stand the printer back on its feet and put the box back on the heatbed.
