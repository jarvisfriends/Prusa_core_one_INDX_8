# Footer: where the content comes from.
title: Where this comes from
paragraphs:
  - >-
    Step pictures and the colour-keyed step text are Prusa Research's, taken from the PDF manuals
    (INDX conversion: all 290 steps; Gen 2 upgrade: the steps a combined build uses).
    The heading of every step links to that step on help.prusa3d.com, where the full-size pictures and the
    readers' comments are.
    Every INDX step is referenced by exactly one row.
    The row text, the order and the notes are this plan's own.
  - >-
    Where the Gen 2 steps slot into the INDX guide follows Prusa's companion article.
    That article's own pictures are not in either PDF, so rows that come from it link to it instead.
  - >-
    Notes marked as comments come from the public comment threads under each step of Prusa's two online manuals
    and under Prusa's companion article, read on 2026-10-05 and 2026-10-06: about 1,250 comments in all.
    They are builders' own experience, retold in this plan's words and credited by name; where builders disagree
    the note says so.
    Other tips are from Prusa forum threads.
    Most forum posts describe the earlier Bondtech Founders Edition kit, whose guide is close to this one but not
    identical, so treat those tips as hints and the manual as the authority.
