name: Check plan

# Runs on pull requests: proves every manual step is still accounted for and that the page builds.
on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Every manual step accounted for
        run: python tools/check.py
      - name: Page builds
        run: python tools/build.py
